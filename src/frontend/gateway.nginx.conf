map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size 4096M;
    client_body_buffer_size 4096M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    location /v-ai/ {
    proxy_pass http://192.168.20.251:38084/;
 #   proxy_set_header Host $host;
    proxy_set_header Host $http_host;

}

    location /cas-demo/api/ {
        proxy_pass http://192.168.20.101:8081/api/;

        # 保持真实请求头
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket（等价于 ws: true）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 1. 解决 iframe 嵌入（你之前的报错）
        add_header X-Frame-Options SAMEORIGIN always;

        # 2. 解决跨域 CORS（你现在的报错 ✅核心）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET,POST,OPTIONS,PUT,DELETE' always;
        add_header Access-Control-Allow-Headers '*' always;
        add_header Access-Control-Allow-Credentials true always;

        # 3. 处理预检请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # 反向代理 /api
    location /api/ {
        proxy_pass http://10.0.4.21:38080/api/;

        # 保持真实请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（等价于 ws: true）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    absolute_redirect off;

    # bisheng platform 入口
    location /bs/ {
        proxy_pass http://192.168.20.239:3001/bs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors *";
        add_header Cache-Control "no-store";
    }

    # bisheng workspace (client) 入口
    location /bs/workspace/ {
        proxy_pass http://192.168.20.239:3001/bs/workspace/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors *";
        add_header Cache-Control "no-store";
    }
    server_tokens off;
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
}

